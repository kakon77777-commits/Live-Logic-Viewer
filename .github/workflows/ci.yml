name: Live Logic CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Viewer dependencies
        run: npm install
      - name: Dependency-free Viewer core verification
        run: npm run verify:core
      - name: Viewer tests
        run: npx vitest run tests
      - name: Production Viewer build
        run: npm run build

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Control Plane dependencies
        run: npm install
      - name: Dependency-free Control Plane core verification
        run: npm run verify:core
      - name: Control Plane tests
        run: npm test

  source-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src shared control-plane tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

  source-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Build commit-matched source snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          ROOT="Live-Logic-Viewer_Integration-v0.2"
          ZIP="${ROOT}_${COMMIT:0:12}.zip"
          mkdir "$ROOT"
          git archive HEAD | tar -x -C "$ROOT"
          printf 'Repository: %s\nBranch: %s\nCommit: %s\n' \
            '${{ github.repository }}' \
            '${{ github.event.pull_request.head.ref }}' \
            "$COMMIT" > "$ROOT/GITHUB_COMMIT.txt"
          (
            cd "$ROOT"
            find . -type f ! -name FILE_MANIFEST.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum > FILE_MANIFEST.sha256
          )
          zip -qr "$ZIP" "$ROOT"
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$ZIP.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: live-logic-viewer-source-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ steps.snapshot.outputs.zip }}
            ${{ steps.snapshot.outputs.sha }}
          if-no-files-found: error
          retention-days: 30
